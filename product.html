<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="bk-logo.jpg">
  <meta name="theme-color" content="#06251d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BK">
  <script src="pwa.js?v=bk-opening-20260919" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bağmancı Ürün Detayı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-base: #020605;
      --panel: rgba(4, 15, 12, 0.92);
      --panel-soft: rgba(7, 22, 18, 0.78);
      --gold-primary: #d4af37;
      --gold-light: #f7e8c3;
      --border: rgba(212, 175, 55, 0.28);
      --text: #f7f6f2;
      --muted: #a3b3ae;
      --green: #34d399;
    }

    
    body[data-theme="day"] {
      --bg-base: #f6ecd2;
      --panel: rgba(255, 249, 232, 0.96);
      --panel-soft: rgba(255, 252, 243, 0.86);
      --gold-primary: #c7961e;
      --gold-light: #76510c;
      --border: rgba(183, 131, 18, 0.42);
      --text: #083f31;
      --muted: #335f50;
      --green: #007456;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 18% 8%, rgba(255, 255, 247, 0.94), transparent 28%),
        radial-gradient(circle at 92% 22%, rgba(225, 202, 143, 0.42), transparent 34%),
        linear-gradient(180deg, #fff8e6 0%, #f6ecd2 48%, #efe0b9 100%);
      color: var(--text);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(17, 42, 34, 0.45), rgba(2, 6, 5, 0.96) 58%), var(--bg-base);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      padding-bottom: 80px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(2, 7, 6, 0.94);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      text-align: center;
      backdrop-filter: blur(16px);
    }
    .brand-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-decoration: none;
    }
    .brand-sub {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--green);
      text-transform: uppercase;
      font-weight: 700;
    }
    .page {
      width: min(1120px, calc(100% - 28px));
      margin: 32px auto;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-light);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }
    .product-shell {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 28px;
      align-items: start;
    }
    .gallery-main {
      position: relative;
      background: #f7f4ee;
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 8px;
      min-height: 520px;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: zoom-in;
      box-shadow: 0 18px 42px rgba(0,0,0,0.34);
    }
    .gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 14px;
      display: block;
      user-select: none;
    }
    .zoom-lens {
      position: absolute;
      width: 168px;
      height: 168px;
      border: 2px solid rgba(247, 232, 195, 0.92);
      border-radius: 50%;
      background-repeat: no-repeat;
      box-shadow: 0 14px 34px rgba(0,0,0,0.38), inset 0 0 0 1px rgba(212, 175, 55, 0.45);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.96);
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 3;
    }
    .gallery-main.zooming .zoom-lens { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .image-fallback { color: #101614; text-align: center; padding: 40px; }
    .image-fallback i { display: block; font-size: 64px; color: var(--gold-primary); margin-bottom: 16px; }
    .thumbs {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      scroll-snap-type: x proximity;
    }
    .thumb {
      flex: 0 0 84px;
      width: 84px;
      height: 84px;
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 7px;
      background: #f7f4ee;
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: hidden;
      scroll-snap-align: start;
      opacity: 0.78;
      transition: opacity 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }
    .thumb.active, .thumb:hover { opacity: 1; border-color: var(--gold-primary); transform: translateY(-2px); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
    .detail-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-flex;
      color: #07120f;
      background: var(--gold-primary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.4px;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: 1px;
      color: var(--gold-light);
      margin-bottom: 14px;
    }
    .desc { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    .price {
      font-size: clamp(34px, 6vw, 56px);
      color: var(--text);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin-bottom: 10px;
    }
    .sku { color: var(--muted); font-size: 13px; letter-spacing: 1px; margin-bottom: 22px; }
    .actions { display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px; gap: 12px; align-items: center; margin-bottom: 24px; }
    .buy, .icon-action { height: 54px; border-radius: 7px; font-weight: 800; cursor: pointer; font-family: inherit; }
    .buy { border: none; background: linear-gradient(135deg, #d4af37 0%, #a6811b 100%); color: #020605; letter-spacing: 1.2px; text-transform: uppercase; }
    .icon-action { border: 1px solid rgba(212, 175, 55, 0.35); color: var(--gold-light); background: rgba(212, 175, 55, 0.08); font-size: 18px; }
    .icon-action:hover, .icon-action.active { color: var(--gold-primary); border-color: var(--gold-primary); background: rgba(212,175,55,0.16); }
    .price-calculation { margin-top: 18px; border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 10px; background: linear-gradient(145deg, rgba(7, 22, 18, 0.84), rgba(2, 7, 6, 0.72)); padding: 16px; display: grid; gap: 12px; }
    .calc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 1px solid rgba(212, 175, 55, 0.14); padding-bottom: 12px; }
    .calc-head span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1.6px; font-weight: 800; }
    .calc-head strong { color: var(--gold-light); font-size: 15px; }
    .calc-live { color: var(--green); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .calc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .calc-cell { border: 1px solid rgba(212, 175, 55, 0.14); border-radius: 8px; background: rgba(2, 6, 5, 0.36); padding: 10px; min-width: 0; }
    .calc-cell span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .calc-cell strong { display: block; margin-top: 4px; color: var(--text); font-size: 13px; overflow-wrap: anywhere; }
    .calc-explain { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .calc-explain p { margin: 0; }
    .calc-explain p + p { margin-top: 8px; }
    .calc-explain strong { color: var(--gold-light); }
    .tabs { margin-top: 28px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
    .tab-head { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .tab-btn { border: none; background: transparent; color: var(--muted); padding: 14px 18px; cursor: pointer; font-weight: 700; letter-spacing: 0.8px; }
    .tab-btn.active { background: rgba(212, 175, 55, 0.16); color: var(--gold-light); }
    .tab-body { padding: 20px; color: var(--muted); }
    .spec-section { margin-bottom: 18px; }
    .spec-section h3 { font-family: 'Cormorant Garamond', serif; color: var(--gold-light); font-size: 24px; margin-bottom: 8px; }
    .spec-row { display: grid; grid-template-columns: 180px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
    .spec-row b { color: var(--text); }
    .spec-row span { color: var(--muted); }
    .lightbox, .cart-choice { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); padding: 20px; }
    .lightbox.open, .cart-choice.open { display: flex; }
    .lightbox-panel { width: min(1080px, 96vw); max-height: 92vh; display: grid; grid-template-rows: 1fr auto; gap: 12px; }
    .lightbox-image { min-height: 0; background: #f7f4ee; border: 1px solid rgba(212,175,55,0.34); border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
    .lightbox-image img { max-width: 100%; max-height: 78vh; object-fit: contain; display: block; }
    .lightbox-close, .lightbox-prev, .lightbox-next { position: absolute; border: 1px solid rgba(212,175,55,0.34); background: rgba(4,15,12,0.86); color: var(--gold-light); border-radius: 7px; cursor: pointer; width: 44px; height: 44px; font-size: 20px; }
    .lightbox-close { top: 18px; right: 18px; }
    .lightbox-prev { left: 18px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 18px; top: 50%; transform: translateY(-50%); }
    .cart-box { width: min(420px, 100%); border: 1px solid var(--border); border-radius: 12px; background: rgba(4, 15, 12, 0.98); padding: 24px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
    .cart-box h3 { font-family: 'Cormorant Garamond', serif; color: var(--gold-light); font-size: 28px; margin-bottom: 8px; }
    .cart-box p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .cart-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cart-actions button, .cart-actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; border-radius: 7px; text-decoration: none; font-weight: 800; font-size: 12px; cursor: pointer; }
    .cart-primary { border: none; background: linear-gradient(135deg, #d4af37 0%, #a6811b 100%); color: #020605; }
    .cart-secondary { border: 1px solid var(--border); background: rgba(212,175,55,0.08); color: var(--gold-light); }
    .app-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 62px;
      background: rgba(2, 7, 6, 0.96);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      border: none;
      background: none;
      font-size: 10px;
      cursor: pointer;
    }
    .app-item i { color: var(--gold-primary); font-size: 17px; margin-bottom: 3px; }
    @media (max-width: 820px) {
      .product-shell { grid-template-columns: 1fr; }
      .gallery-main { min-height: 360px; }
      .actions { grid-template-columns: 1fr 52px 52px; }
      .calc-grid { grid-template-columns: 1fr; }
      .spec-row { grid-template-columns: 1fr; gap: 2px; }
      .lightbox-prev, .lightbox-next { top: auto; bottom: 102px; transform: none; }
    }
    @media (max-width: 520px) {
      .page { width: min(100% - 20px, 1120px); margin-top: 22px; }
      .detail-panel { padding: 22px; }
      .gallery-main { min-height: 310px; }
      .actions { grid-template-columns: 1fr 48px 48px; gap: 8px; }
      .cart-actions { grid-template-columns: 1fr; }
    }

    /* Ürün detay profesyonel düzen */
    .top-tools {
      display: grid;
      grid-template-columns: auto minmax(260px, 1fr);
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }
    .back-link {
      justify-content: center;
      min-height: 44px;
      margin-bottom: 0;
      border: 1px solid rgba(212, 175, 55, 0.24);
      border-radius: 8px;
      padding: 0 14px;
      background: rgba(4, 15, 12, 0.76);
    }
    .product-search {
      position: relative;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 48px 48px;
      align-items: center;
      min-height: 46px;
      border: 1px solid rgba(212, 175, 55, 0.24);
      border-radius: 10px;
      background: rgba(4, 15, 12, 0.82);
      box-shadow: inset 0 1px 0 rgba(247, 232, 195, 0.05);
    }
    .product-search > i { color: var(--gold-primary); font-size: 14px; justify-self: center; }
    .product-search input[type="search"] { width: 100%; min-width: 0; border: none; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 13px; }
    .product-search input[type="search"]::placeholder { color: rgba(163, 179, 174, 0.68); }
    .search-btn, .image-search-btn {
      width: 38px;
      height: 36px;
      border-radius: 7px;
      border: 1px solid rgba(212, 175, 55, 0.28);
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      cursor: pointer;
      justify-self: center;
    }
    .search-btn:hover, .image-search-btn:hover { border-color: var(--gold-primary); background: rgba(212, 175, 55, 0.18); }
    .search-results {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 30;
      display: none;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.26);
      border-radius: 10px;
      background: rgba(3, 10, 8, 0.98);
      box-shadow: 0 18px 42px rgba(0,0,0,0.44);
    }
    .search-results.open { display: block; }
    .search-result {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 9px 10px;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .search-result:last-child { border-bottom: none; }
    .search-result:hover { background: rgba(212, 175, 55, 0.09); }
    .search-result img, .search-result .no-image { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: #f7f4ee; color: #07120f; display: grid; place-items: center; }
    .search-result strong { display: block; color: var(--gold-light); font-size: 12px; line-height: 1.25; }
    .search-result span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .gallery-main img { object-fit: cover !important; object-position: center !important; padding: 0 !important; }
    .gallery-fav {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 4;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(247, 232, 195, 0.72);
      background: rgba(3, 10, 8, 0.66);
      color: var(--gold-light);
      font-size: 17px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    }
    .gallery-fav.active, .gallery-fav:hover { color: var(--gold-primary); border-color: var(--gold-primary); background: rgba(3, 10, 8, 0.82); }
    .zoom-lens { width: 190px; height: 190px; }
    .price {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      width: fit-content;
      max-width: 100%;
      padding: 12px 16px 10px;
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(247, 232, 195, 0.08), rgba(212, 175, 55, 0.035));
      box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.05), 0 12px 26px rgba(0,0,0,0.24);
    }
    .price .currency { color: var(--gold-primary); font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .formula-pill { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 7px 10px; border: 1px solid rgba(212, 175, 55, 0.22); border-radius: 999px; background: rgba(212, 175, 55, 0.07); }
    .actions { grid-template-columns: minmax(0, 1fr) 56px !important; margin-bottom: 18px; }
    .price-calculation { margin-top: 14px; }
    .calc-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .calc-cell { min-width: 0; min-height: 54px; padding: 8px 10px; }
    .calc-cell strong { font-size: 13px; line-height: 1.25; }
    .spec-section h3 { font-size: 22px; margin-bottom: 12px; }
    .spec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .spec-row { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 10px 12px; border: 1px solid rgba(212,175,55,0.13); border-radius: 7px; background: rgba(7,22,18,0.48); font-size: 13px; }
    .spec-row b { color: var(--muted); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.2px; }
    .spec-row span { color: var(--gold-light); font-weight: 700; }
    @media (max-width: 820px) {
      .top-tools { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr 52px !important; }
      .calc-grid, .spec-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
    }
    @media (max-width: 420px) {
      .calc-grid, .spec-grid { grid-template-columns: 1fr 1fr !important; }
      .product-search { grid-template-columns: 30px minmax(0, 1fr) 42px 42px; }
      .price { font-size: 34px; }
    }

    /* Favori ve kucuk gorsel duzeltmeleri */
    .thumb img { object-fit: cover !important; padding: 0 !important; object-position: center !important; }
    .gallery-fav.active i { color: var(--gold-primary); }
    /* Gündüz tema: ürün detay sayfasını ana palete bağla */
    body[data-theme="day"] header,
    body[data-theme="day"] .app-bar {
      background: rgba(255, 249, 232, 0.97) !important;
      border-color: rgba(183, 131, 18, 0.34) !important;
      box-shadow: 0 10px 34px rgba(122, 86, 18, 0.14);
    }
    body[data-theme="day"] .brand-logo,
    body[data-theme="day"] h1,
    body[data-theme="day"] .cart-box h3,
    body[data-theme="day"] .spec-section h3 {
      color: #76510c !important;
    }
    body[data-theme="day"] .brand-sub,
    body[data-theme="day"] .app-item,
    body[data-theme="day"] .desc,
    body[data-theme="day"] .sku,
    body[data-theme="day"] .tab-body,
    body[data-theme="day"] .search-result span {
      color: #335f50 !important;
    }
    body[data-theme="day"] .back-link,
    body[data-theme="day"] .product-search,
    body[data-theme="day"] .detail-panel,
    body[data-theme="day"] .tabs,
    body[data-theme="day"] .calc-cell,
    body[data-theme="day"] .spec-row,
    body[data-theme="day"] .cart-box {
      background: linear-gradient(180deg, rgba(255, 251, 238, 0.98), rgba(248, 236, 204, 0.94)) !important;
      border-color: rgba(183, 131, 18, 0.36) !important;
      color: #083f31 !important;
      box-shadow: 0 16px 38px rgba(116, 83, 18, 0.12);
    }
    body[data-theme="day"] .gallery-main,
    body[data-theme="day"] .thumb,
    body[data-theme="day"] .lightbox-image,
    body[data-theme="day"] .search-result img,
    body[data-theme="day"] .search-result .no-image {
      background: #fffaf0 !important;
      border-color: rgba(183, 131, 18, 0.28) !important;
    }
    body[data-theme="day"] .product-search input[type="search"] {
      color: #083f31 !important;
    }
    body[data-theme="day"] .product-search input[type="search"]::placeholder {
      color: rgba(51, 95, 80, 0.72) !important;
    }
    body[data-theme="day"] .search-btn,
    body[data-theme="day"] .image-search-btn,
    body[data-theme="day"] .icon-action,
    body[data-theme="day"] .cart-secondary,
    body[data-theme="day"] .gallery-fav {
      background: rgba(255, 252, 243, 0.78) !important;
      border-color: rgba(183, 131, 18, 0.34) !important;
      color: #76510c !important;
    }
    body[data-theme="day"] .search-results {
      background: rgba(255, 249, 232, 0.99) !important;
      border-color: rgba(183, 131, 18, 0.34) !important;
      box-shadow: 0 18px 42px rgba(122, 86, 18, 0.18) !important;
    }
    body[data-theme="day"] .search-result {
      color: #083f31 !important;
      border-bottom-color: rgba(8, 63, 49, 0.12) !important;
    }
    body[data-theme="day"] .search-result:hover,

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const THEME_KEY = 'bagmanciThemeMode';
    function effectiveTheme(mode = localStorage.getItem(THEME_KEY) || 'night') {
      if (mode === 'system') return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
      return mode === 'day' ? 'day' : 'night';
    }
    function applyStoredTheme() {
      document.body.dataset.theme = effectiveTheme();
    }

    let product = null;
    let productImages = [];
    let currentImageIndex = 0;
    let liveBilezikPrice = 0;
    let livePriceTimer = null;
    let allProducts = [];

    function apiUrl(path) {
      const isLocalPreview = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocalPreview && path === '/api/sukob') {
        return 'https://bagmancikuyumculuk.com.tr/api/sukob';
      }
      return path;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    function parseProductTable(text) {
      const cleanText = text.replace(/^\uFEFF/, '').trim();
      if (!cleanText) return [];
      const firstLine = cleanText.split(/\r?\n/)[0] || '';
      const delimiter = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < cleanText.length; i++) {
        const char = cleanText[i];
        const next = cleanText[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') { cell += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (char === delimiter && !inQuotes) {
          row.push(cell.trim()); cell = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(cell.trim()); rows.push(row); row = []; cell = '';
        } else {
          cell += char;
        }
      }
      row.push(cell.trim()); rows.push(row);
      const headers = rows.shift().map(header => header.trim());
      return rows.filter(values => values.some(value => value.trim())).map(values => {
        const item = {};
        headers.forEach((header, index) => { item[header] = values[index] || ''; });
        return tableRowToProduct(item);
      });
    }

    function toNumber(value) {
      if (value === null || value === undefined || value === '') return null;
      const number = Number(String(value).replace(',', '.'));
      return Number.isFinite(number) ? number : null;
    }

    function field(row, camel, snake = camel) {
      return row[camel] ?? row[snake] ?? '';
    }

    function tableRowToProduct(row) {
      const rawImages = field(row, 'images');
      const images = Array.isArray(rawImages)
        ? rawImages.filter(Boolean)
        : String(rawImages || '').split('|').map(image => image.trim()).filter(Boolean);
      const gram = toNumber(field(row, 'gram'));
      const fixedPrice = toNumber(field(row, 'fixedPrice', 'fixed_price'));
      const labor = toNumber(field(row, 'labor')) || 0;
      const laborType = field(row, 'laborType', 'labor_type') || 'gram';
      const category = field(row, 'category');
      const sku = field(row, 'sku');
      const material = field(row, 'material');
      const ayar = field(row, 'ayar');
      const renk = field(row, 'renk');
      const tas = field(row, 'tas');
      const olcu = field(row, 'olcu');
      const stok = field(row, 'stok');
      const shortDescription = field(row, 'shortDescription', 'short_description');
      const description = field(row, 'description') || shortDescription;
      const toplamGram = gram && laborType === 'gram' ? gram + labor : gram;
      const laborText = labor ? (laborType === 'money' ? `${labor.toLocaleString('tr-TR')} TL` : `${labor.toLocaleString('tr-TR')} gr`) : '';
      const features = [
        ['Kategori', category], ['Stok Kodu', sku], ['Materyal', material], ['Ayar', ayar],
        ['Gram', gram ? `${gram.toLocaleString('tr-TR')} gr` : ''],
        ['İşçilik', laborText],
        ['Hesap Gramı', toplamGram && laborType === 'gram' ? `${toplamGram.toLocaleString('tr-TR')} gr` : ''],
        ['Renk', renk], ['Taş', tas], ['Ölçü', olcu], ['Stok', stok]
      ].filter(([, value]) => value !== null && value !== undefined && String(value).trim())
       .map(([label, value]) => ({ label, value: String(value) }));
      return { id: field(row, 'id'), name: field(row, 'name'), category, sku, badge: field(row, 'badge') || category, priceMode: field(row, 'priceMode', 'price_mode') || (gram ? 'liveGram' : 'fixed'), gram, labor, laborType, fixedPrice, images, media: Array.isArray(row.media) ? row.media : [], shortDescription, description, features, sections: [{ title: 'Ürün Özellikleri', items: features }] };
    }

    async function loadProductsFromSupabase() {
      const cfg = window.BAGMANCI_SUPABASE || {};
      if (!cfg.url || !cfg.anonKey || !window.supabase) return [];
      const client = window.supabase.createClient(cfg.url, cfg.anonKey);
      const { data, error } = await client.from('products').select('*').eq('active', true).order('created_at', { ascending: false });
      if (error) throw error;
      return (data || []).map(tableRowToProduct);
    }

    async function loadProductsData() {
      try {
        const supabaseProducts = await loadProductsFromSupabase();
        if (supabaseProducts.length) return supabaseProducts;
      } catch (error) { console.warn('Supabase ürünleri okunamadı, yerel dosyalar deneniyor:', error); }
      try {
        const csvResponse = await fetch('products.csv', { cache: 'no-store' });
        if (csvResponse.ok) {
          const csvProducts = parseProductTable(await csvResponse.text());
          if (csvProducts.length) return csvProducts;
        }
      } catch (error) { console.warn('products.csv okunamadı, products.json deneniyor:', error); }
      const jsonResponse = await fetch('products.json', { cache: 'no-store' });
      if (!jsonResponse.ok) throw new Error(`products.json HTTP ${jsonResponse.status}`);
      return jsonResponse.json();
    }

    function money(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '--';
      return number.toLocaleString('tr-TR');
    }

    function totalGram(item) {
      const gram = Number(item?.gram) || 0;
      const labor = Number(item?.labor) || 0;
      return item?.laborType === 'money' ? gram : gram + labor;
    }

    function productPrice(item) {
      if (item.priceMode === 'liveGram' && Number(item.gram) && liveBilezikPrice) {
        const basePrice = (Number(item.gram) || 0) * liveBilezikPrice;
        const laborPrice = item.laborType === 'money' ? (Number(item.labor) || 0) : (Number(item.labor) || 0) * liveBilezikPrice;
        return Math.round(basePrice + laborPrice);
      }
      return Number(item.fixedPrice || 0);
    }

    function renderPrice() {
      if (!product) return;
      const price = productPrice(product);
      const laborType = product.laborType || 'gram';
      const gram = Number(product.gram || 0);
      const labor = Number(product.labor || 0);
      const laborValue = labor.toLocaleString('tr-TR');
      const isLive = product.priceMode === 'liveGram';
      const priceEl = document.getElementById('product-price');
      const calcEl = document.getElementById('price-calculation');
      if (priceEl) priceEl.innerHTML = price ? `<span>${money(price)}</span><span class="currency">TL</span>` : '<span>Fiyat için iletişime geçin</span>';
      if (!calcEl) return;
      const formula = isLive
        ? (laborType === 'money' ? `${gram.toLocaleString('tr-TR')} gr x canlı kur + ${laborValue} TL işçilik` : `(${gram.toLocaleString('tr-TR')} gr + ${laborValue} gr işçilik) x canlı kur`)
        : 'Fiyat mağaza tarafından teyit edilir';
      const liveText = isLive && liveBilezikPrice ? `Canlı kur ${money(liveBilezikPrice)} TL` : 'Mağaza teyitli';
      const laborText = labor ? (laborType === 'money' ? `${laborValue} TL` : `${laborValue} gr`) : 'Ürüne göre';
      calcEl.innerHTML = `
        <div class="calc-head"><div><span>Fiyat Hesaplama</span><strong>${escapeHtml(formula)}</strong></div><em class="calc-live">${escapeHtml(liveText)}</em></div>
        <div class="calc-grid">
          <div class="calc-cell"><span>Gram</span><strong>${gram ? gram.toLocaleString('tr-TR') + ' gr' : 'Mağazada teyit'}</strong></div>
          <div class="calc-cell"><span>İşçilik</span><strong>${escapeHtml(laborText)}</strong></div>
          <div class="calc-cell"><span>Stok</span><strong>${escapeHtml(product.sku || product.id || 'Mağaza kaydı')}</strong></div>
        </div>
        <div class="calc-explain"><p><strong>İşçilik nedir?</strong> Modele göre işçilik değişir; model zorluğu, atölye emeği ve ürün hazırlığı için eklenen değerdir.</p><p><strong>Canlı kur nedir?</strong> Canlı kur otomatik olarak güncellenir; nihai tutar gram, canlı kur ve işçilik birlikte değerlendirilerek mağazada teyit edilir.</p></div>`;
    }

    function renderImageByIndex(index) {
      currentImageIndex = Math.max(0, Math.min(index, productImages.length - 1));
      const src = productImages[currentImageIndex];
      const main = document.getElementById('main-image');
      main.onmousemove = null; main.onmouseleave = null; main.classList.remove('zooming');
      if (product.media?.[currentImageIndex]?.type === 'video') {
        main.replaceChildren();
        const video = document.createElement('video');
        video.src = src; video.controls = true; video.playsInline = true; video.preload = 'metadata';
        video.style.cssText = 'width:100%;height:100%;object-fit:contain';
        main.append(video);
        document.querySelectorAll('#thumbs .thumb').forEach((thumb, i) => thumb.classList.toggle('active', i === currentImageIndex));
        return;
      }
      if (!src) { main.innerHTML = '<div class="image-fallback"><i class="fa-solid fa-gem"></i><strong>Ürün görseli yakında</strong></div>'; return; }
      const favoriteActive = isFavorite(product.id);
      main.innerHTML = `<button class="gallery-fav ${favoriteActive ? 'active' : ''}" type="button" onclick="toggleFavorite(event)" title="Favori" aria-label="Favori"><i class="fa-${favoriteActive ? 'solid' : 'regular'} fa-heart"></i></button><img id="main-product-img" src="${src}" alt="${escapeHtml(product.name)}"><div class="zoom-lens" id="zoom-lens"></div>`;
      const img = document.getElementById('main-product-img');
      img.onclick = () => openLightbox(currentImageIndex);
      img.onerror = () => {
        img.onerror = null;
        main.innerHTML = '<div class="image-fallback"><i class="fa-solid fa-gem"></i><strong>Ürün görseli yakında</strong></div>';
      };
      document.querySelectorAll('#thumbs .thumb').forEach((thumb, thumbIndex) => thumb.classList.toggle('active', thumbIndex === currentImageIndex));
      setupZoom();
    }

    function setupZoom() {
      const main = document.getElementById('main-image');
      const img = document.getElementById('main-product-img');
      const lens = document.getElementById('zoom-lens');
      if (!main || !img || !lens) return;
      main.onmousemove = event => {
        if (window.innerWidth < 860) return;
        const rect = main.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        lens.style.left = `${x}px`; lens.style.top = `${y}px`;
        lens.style.backgroundImage = `url("${img.src}")`;
        lens.style.backgroundSize = `${rect.width * 3.15}px ${rect.height * 3.15}px`;
        lens.style.backgroundPosition = `${(x / rect.width) * 100}% ${(y / rect.height) * 100}%`;
        main.classList.add('zooming');
      };
      main.onmouseleave = () => main.classList.remove('zooming');
    }

    function renderThumbs() {
      const root = document.getElementById('thumbs'); root.replaceChildren();
      productImages.forEach((src, index) => {
        const button = document.createElement('button'); button.className = 'thumb'; button.type = 'button';
        button.setAttribute('aria-label', 'Medya ' + (index + 1)); button.onclick = () => renderImageByIndex(index);
        if (product.media?.[index]?.type === 'video') button.textContent = '▶ Video';
        else { const img = document.createElement('img'); img.src = src; img.alt = product.name; button.append(img); }
        root.append(button);
      });
    }

    function renderProduct() {
      document.title = `${product.name} | Bağmancı Kuyumculuk`;
      document.getElementById('badge').innerText = product.badge || product.category || 'ÜRÜN';
      document.getElementById('product-name').innerText = product.name;
      document.getElementById('short-description').innerText = product.shortDescription || '';
      document.getElementById('sku').innerText = product.sku || '';
      productImages = Array.isArray(product.media) && product.media.length ? product.media.map(item => item.url) : (Array.isArray(product.images) ? product.images : []);
      renderPrice(); renderThumbs(); renderImageByIndex(0);
      showTab('features');
    }

    function showTab(name) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const active = [...document.querySelectorAll('.tab-btn')].find(btn => btn.textContent.toLocaleLowerCase('tr-TR').includes(name === 'features' ? 'özellik' : name === 'description' ? 'açıklama' : name === 'payment' ? 'ödeme' : 'iade'));
      if (active) active.classList.add('active');
      const body = document.getElementById('tab-body');
      if (name === 'description') { body.innerHTML = `<p>${escapeHtml(product.description || product.shortDescription || 'Ürün açıklaması yakında eklenecek.')}</p>`; return; }
      if (name === 'payment') { body.innerHTML = '<p>Ödeme yöntemi ve tahsilat akışı yakında daha düzenli hale getirilecektir. Güncel ödeme bilgisi için mağaza ile iletişime geçebilirsiniz.</p>'; return; }
      if (name === 'return') { body.innerHTML = '<p>İade yoktur. Değişim, ürünün kullanılmadığı ve zarar görmediği mağaza tarafından tespit edilirse değerlendirilebilir. Kişiye özel hazırlanan ürünlerde değişim koşulları ayrıca teyit edilir.</p>'; return; }
      body.innerHTML = (product.sections || []).map(section => `<div class="spec-section"><h3>${escapeHtml(section.title)}</h3><div class="spec-grid">${(section.items || []).map(row => `<div class="spec-row"><b>${escapeHtml(row.label)}</b><span>${escapeHtml(row.value)}</span></div>`).join('')}</div></div>`).join('') || '<p>Ürün özellikleri yakında eklenecek.</p>';
    }

    function readCart() { try { return JSON.parse(localStorage.getItem('bagmanciSepet') || '[]'); } catch { return []; } }
    function writeCart(items) { localStorage.setItem('bagmanciSepet', JSON.stringify(items)); }
    function addToCart() {
      const price = productPrice(product);
      const cart = readCart();
      cart.push({ id: product.id, ad: product.name, f: price || 0, sku: product.sku || product.id, image: product.images?.[0] || '' });
      writeCart(cart);
      document.getElementById('cart-choice-text').innerText = `${product.name} sepetine eklendi. Sepete gidip sipariş oluşturabilir ya da alışverişe devam edebilirsin.`;
      document.getElementById('cart-choice').classList.add('open');
    }
    function closeCartChoice() { document.getElementById('cart-choice').classList.remove('open'); }

    async function shareProduct() {
      const shareData = { title: product.name, text: `${product.name} | Bağmancı Kuyumculuk`, url: window.location.href };
      if (navigator.share) { await navigator.share(shareData).catch(() => {}); return; }
      await navigator.clipboard.writeText(window.location.href).catch(() => {});
      alert('Ürün linki kopyalandı.');
    }

    function isFavorite(id) {
      const favoriler = JSON.parse(localStorage.getItem('bagmanciFavoriler') || '[]');
      return favoriler.some(item => item.id === id);
    }

    function toggleFavorite(event) {
      if (event) event.stopPropagation();
      const key = 'bagmanciFavoriler';
      const favoriler = JSON.parse(localStorage.getItem(key) || '[]');
      const index = favoriler.findIndex(item => item.id === product.id);
      const adding = index < 0;
      if (adding) favoriler.push({ id: product.id, ad: product.name });
      else favoriler.splice(index, 1);
      localStorage.setItem(key, JSON.stringify(favoriler));
      document.querySelectorAll('.gallery-fav, .fav').forEach(button => {
        button.classList.toggle('active', adding);
        button.innerHTML = `<i class="fa-${adding ? 'solid' : 'regular'} fa-heart"></i>`;
      });
    }

    function normalizeSearch(value) {
      return String(value || '').toLocaleLowerCase('tr-TR').replaceAll('ğ','g').replaceAll('ü','u').replaceAll('ş','s').replaceAll('ı','i').replaceAll('ö','o').replaceAll('ç','c');
    }

    function matchedProducts() {
      const input = document.getElementById('product-search-input');
      const query = normalizeSearch(input ? input.value : '').trim();
      if (!query) return [];
      return allProducts.filter(item => normalizeSearch([item.name, item.category, item.sku, item.id, item.badge].filter(Boolean).join(' ')).includes(query)).slice(0, 6);
    }

    function renderSearchResults(items, emptyText = 'Sonuç bulunamadı') {
      const box = document.getElementById('search-results');
      if (!box) return;
      if (!items.length) {
        box.innerHTML = `<div class="search-result"><div class="no-image"><i class="fa-solid fa-magnifying-glass"></i></div><div><strong>${emptyText}</strong><span>Başka ürün adı, kategori veya kod dene.</span></div></div>`;
        box.classList.add('open');
        return;
      }
      box.innerHTML = items.map(item => {
        const img = Array.isArray(item.images) && item.images[0] ? `<img src="${item.images[0]}" alt="${escapeHtml(item.name)}">` : '<div class="no-image"><i class="fa-solid fa-gem"></i></div>';
        return `<button class="search-result" type="button" onclick="goToProduct('${encodeURIComponent(item.id)}')">${img}<div><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.category || '')} ${item.sku ? '· ' + escapeHtml(item.sku) : ''}</span></div></button>`;
      }).join('');
      box.classList.add('open');
    }

    function handleSearchInput() {
      const input = document.getElementById('product-search-input');
      const box = document.getElementById('search-results');
      if (!input || !box) return;
      if (!input.value.trim()) { box.classList.remove('open'); box.innerHTML = ''; return; }
      renderSearchResults(matchedProducts());
    }

    function handleSearchKey(event) {
      if (event.key === 'Enter') { event.preventDefault(); performSearch(); }
      if (event.key === 'Escape') document.getElementById('search-results').classList.remove('open');
    }

    function performSearch() {
      const items = matchedProducts();
      if (items.length) { goToProduct(encodeURIComponent(items[0].id)); return; }
      renderSearchResults([], 'Aradığın ürün bulunamadı');
    }

    function goToProduct(id) { window.location.href = `product.html?id=${id}`; }
    function openVisualSearch() { document.getElementById('visual-search-file').click(); }
    function handleVisualSearchFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const words = file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
      document.getElementById('product-search-input').value = words;
      const items = matchedProducts();
      renderSearchResults(items, items.length ? '' : 'Görsele göre eşleşme bulunamadı');
    }

    function openLightbox(index = currentImageIndex) { if (!productImages.length) return; currentImageIndex = index; renderLightbox(); document.getElementById('lightbox').classList.add('open'); }
    function closeLightbox() { document.querySelectorAll('#lightbox video').forEach(video => video.pause()); document.getElementById('lightbox').classList.remove('open'); }
    function lightboxStep(step) { if (!productImages.length) return; currentImageIndex = (currentImageIndex + step + productImages.length) % productImages.length; renderImageByIndex(currentImageIndex); renderLightbox(); }
    function renderLightbox() {
      const src = productImages[currentImageIndex];
      const root = document.getElementById('lightbox-image'); root.replaceChildren();
      const media = document.createElement(product.media?.[currentImageIndex]?.type === 'video' ? 'video' : 'img');
      media.src = src; media.style.cssText = 'max-width:100%;max-height:78vh;object-fit:contain';
      if (media.tagName === 'VIDEO') { media.controls = true; media.playsInline = true; } else media.alt = product.name;
      root.append(media);
      const thumbs = document.getElementById('lightbox-thumbs'); thumbs.replaceChildren();
      productImages.forEach((url, index) => {
        const button = document.createElement('button'); button.type = 'button';
        button.className = 'thumb' + (index === currentImageIndex ? ' active' : '');
        button.setAttribute('aria-label', 'Medya ' + (index + 1));
        button.onclick = () => { renderImageByIndex(index); renderLightbox(); };
        if (product.media?.[index]?.type === 'video') button.textContent = '▶ Video';
        else { const img = document.createElement('img'); img.src = url; img.alt = product.name; button.append(img); }
        thumbs.append(button);
      });
    }

    async function loadLivePrice() {
      try {
        const response = await fetch(`${apiUrl('/api/sukob')}?cache=${Date.now()}`, { cache: 'no-store' });
        const data = await response.json();
        const bilezik = data.find(item => item.url === '22_ayar_bilezik');
        liveBilezikPrice = Math.round(Number(bilezik?.sellPrice || 0));
        renderPrice();
      } catch (error) { liveBilezikPrice = 0; }
    }

    function configureBackLink(params) {
      const from = params.get('from') || '';
      const query = params.get('q') || '';
      const back = document.getElementById('productBackLink');
      if (!back) return;
      if (from === 'account-history') {
        back.href = 'index.html#account-history';
        back.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Hesabıma Dön';
        return;
      }
      if (from === 'search') {
        back.href = `index.html#search${query ? '?' + new URLSearchParams({ q: query }).toString() : ''}`;
        back.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Aramaya Dön';
        return;
      }
      if (from === 'assistant') {
        back.href = 'index.html#account-assistant';
        back.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Asistana Dön';
      }
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      configureBackLink(params);
      const id = params.get('id');
      const [products] = await Promise.all([loadProductsData(), loadLivePrice()]);
      allProducts = products;
      product = products.find(item => item.id === id) || products[0];
      renderProduct();
      if (livePriceTimer) clearInterval(livePriceTimer);
      livePriceTimer = setInterval(loadLivePrice, 10000);
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') { closeLightbox(); closeCartChoice(); const box = document.getElementById('search-results'); if (box) box.classList.remove('open'); }
      if (document.getElementById('lightbox').classList.contains('open') && event.key === 'ArrowLeft') lightboxStep(-1);
      if (document.getElementById('lightbox').classList.contains('open') && event.key === 'ArrowRight') lightboxStep(1);
    });

    applyStoredTheme();
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', applyStoredTheme);
    init().catch(() => { document.getElementById('product-shell').innerHTML = '<p>Ürün bilgisi yüklenemedi.</p>'; });
  </script>
</body>
</html>
